name: Build, test & deploy

# Every push / PR: type-check, build, static QA (scripts/check-site.mjs) and the
# Playwright smoke suite. Pushes to `main` then deploy dist/ to Namecheap over FTPS —
# once these repository secrets exist (Settings → Secrets and variables → Actions):
#   FTP_SERVER     e.g. ftp.marketixo.com   (cPanel → FTP Accounts → Configure FTP Client)
#   FTP_USERNAME   e.g. deploy@marketixo.com
#   FTP_PASSWORD
# Optional repository variables (Settings → Variables): PUBLIC_SITE_URL, PUBLIC_GA4_ID,
# PUBLIC_GTM_ID, PUBLIC_META_PIXEL_ID, PUBLIC_GSC_VERIFICATION, NOINDEX ("true" for staging),
# FTP_SERVER_DIR (default ./public_html/).

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      PUBLIC_SITE_URL: ${{ vars.PUBLIC_SITE_URL || 'https://marketixo.com' }}
      PUBLIC_GA4_ID: ${{ vars.PUBLIC_GA4_ID }}
      PUBLIC_GTM_ID: ${{ vars.PUBLIC_GTM_ID }}
      PUBLIC_META_PIXEL_ID: ${{ vars.PUBLIC_META_PIXEL_ID }}
      PUBLIC_GSC_VERIFICATION: ${{ vars.PUBLIC_GSC_VERIFICATION }}
      NOINDEX: ${{ vars.NOINDEX }}
      FTP_SERVER: ${{ secrets.FTP_SERVER }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run build

      - name: Smoke tests (Playwright)
        run: |
          npx playwright install --with-deps chromium firefox webkit
          npm test

      - name: Deploy to Namecheap (FTPS)
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && env.FTP_SERVER != ''
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          local-dir: ./dist/
          server-dir: ${{ vars.FTP_SERVER_DIR || './public_html/' }}
