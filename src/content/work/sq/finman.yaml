key: finman
lang: sq
industry: Grup holding — ndërtim, prokurim, transport, pasuri të paluajtshme
location: Tiranë, Shqipëri
summary: >-
  Faqja korporative e Finman Group, shoqëri mëmë e kompanive në ndërtim, prokurim, transport hekurudhor dhe
  pasuri të paluajtshme.
metaDescription: >-
  Rast studimi — faqja korporative e Finman Group në Tiranë, që lidh kompanitë e grupit në ndërtim, prokurim, transport dhe prona. Ueb, SEO, reklama, rrjete sociale.
overview: >-
  Finman Group u ofron klientëve publikë dhe privatë shërbime të specializuara sipas sektorit, përmes një
  portofoli kompanish që përfshin Albstar, Fintrade dhe IR Real Estate. Veprimtaria e saj shtrihet në
  ndërtim, prokurim, transport hekurudhor, pasuri të paluajtshme dhe shërbime.
challenge: >-
  Një shoqëri holding duhet të shpjegojë diçka abstrakte — çfarë është grupi — dhe njëkohësisht t’i japë çdo
  kompanie vendin e vet. Faqja duhej t’u shërbente partnerëve, klientëve nga sektori publik dhe kandidatëve
  për punë, dhe të funksiononte si qendra që lidh disa faqe kompanish.
approach: >-
  E ndërtuam faqen rreth katër pyetjeve — kush është grupi, çfarë zotëron, çfarë ka të re dhe si mund të
  bashkëpunoni me të. Seksioni i portofolit prezanton secilën kompani dhe lidhet me faqen e saj, ndërsa
  seksionet e lajmeve dhe të karrierës u shërbejnë medias dhe aplikantëve.
design: >-
  Bluja e thellë e Finman dhe theksi i verdhë i logos, me një deklaratë hyrëse të fuqishme dhe detaje
  praktike — adresë, orar, email dhe telefon — gjithmonë të dukshme në shiritin e sipërm.
development: >-
  Një faqe WordPress që ekipi i grupit e përditëson drejtpërdrejt, me të njëjtën gjuhë vizuale dhe të njëjtat
  modele navigimi si faqet e kompanive të grupit. Mbështetja për SEO, reklama dhe rrjete sociale vazhdon.
result: >-
  Finman Group ka një faqe qendrore që e paraqet grupin qartë dhe i lidh vizitorët me secilën nga kompanitë
  e tij.
highlights:
  - Qendër e grupit me lidhje drejt faqes së çdo kompanie
  - Seksione për portofolin, lajmet dhe karrierën
  - Kontaktet dhe orari të dukshme në çdo faqe
  - Gjuhë vizuale e përbashkët në të gjitha faqet e grupit
