key: fintrade
lang: sq
industry: Prokurim dhe furnizim industrial
location: Tiranë, Shqipëri
summary: >-
  Një faqe dygjuhëshe për një kompani prokurimi që furnizon zgjidhje për infrastrukturë, energji, ujë dhe
  makineri në Shqipëri dhe Kosovë.
metaDescription: >-
  Rast studimi — faqe dygjuhëshe për Fintrade, kompani prokurimi në Tiranë për projekte infrastrukture, energjie dhe uji. WordPress, SEO, reklama, rrjete sociale.
overview: >-
  Fintrade është një kompani prokurimi në Tiranë, pjesë e Finman Group. Ajo furnizon produkte dhe zgjidhje
  për punime civile dhe infrastrukturë, makineri dhe pajisje, energji, si dhe trajtim të ujit dhe të ujërave
  të ndotura, për klientë në Shqipëri dhe Kosovë.
challenge: >-
  Prokurimi është biznes besimi dhe gamë. Inxhinierët dhe blerësit duhet të shohin shpejt cilëve sektorë u
  shërben Fintrade, çfarë ka realizuar dhe me kë të kontaktojnë — në shqip ose në anglisht.
approach: >-
  Faqja është organizuar sipas sektorëve që u shërben Fintrade, e mbështetur nga një seksion projektesh dhe
  një histori e qartë e kompanisë. Një mesazh rekrutimi në shiritin e sipërm mbështet punësimin krahas
  përmbajtjes tregtare.
design: >-
  Një pamje e çelët, arkitekturore, në ngjyrat indigo dhe portokalli të Fintrade, me një deklaratë të madhe
  hyrëse, imazhe xhami e çeliku dhe faqe sektorësh të pastra.
development: >-
  E ndërtuar në WordPress, me versione në shqip dhe anglisht që ekipi i mirëmban vetë, e mbështetur nga
  SEO, reklama dhe rrjete sociale të vazhdueshme.
result: >-
  Fintrade i paraqet sektorët, projektet dhe ekipin e vet në dy gjuhë, në një faqe që stafi e menaxhon vetë.
highlights:
  - Faqe të veçanta për çdo sektor që mbulon
  - Përmbajtje në shqip dhe anglisht
  - Seksione për projektet dhe karrierën
  - Pjesë e familjes së faqeve të Finman Group
