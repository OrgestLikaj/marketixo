key: ir-real-estate
lang: sq
industry: Pasuri të paluajtshme dhe menaxhim pronash
location: Tiranë, Shqipëri
summary: >-
  Një faqe e guximshme, e udhëhequr nga imazhi, për kompaninë që qëndron pas Arena Center — kompleksit
  shumëfunksional rreth Air Albania Stadium në Tiranë.
metaDescription: >-
  Rast studimi — faqe për IR Real Estate & Management, kompaninë pas Arena Center në Tiranë. Dizajn me fokus te imazhi, WordPress, SEO, reklama, rrjete sociale.
overview: >-
  IR Real Estate & Management menaxhon Arena Center në Tiranë — një kompleks që bashkon Air Albania Stadium,
  një hotel Marriott, një qendër tregtare dhe zyra — dhe tregton projekte rezidenciale si Altana Luxury
  Residence. IR është pjesë e Finman Group.
challenge: >-
  Prona të lë përshtypje kur e sheh nga afër; faqja duhej ta arrinte këtë online. Publikë të ndryshëm —
  qiramarrës, klientë zyrash, vizitorë dhe blerës — duhej ta gjenin shpejt pjesën e tyre të kompleksit, pa e
  kthyer faqen në një broshurë me faqe të shkëputura nga njëra-tjetra.
approach: >-
  E lamë arkitekturën të udhëheqë. Fotografi të mëdha e prezantojnë kompleksin, të ndjekura nga një ndarje e
  qartë e pjesëve të tij — hapësira tregtare, stadiumi, hoteli dhe zyrat — secila me historinë e vet të
  shkurtër, si dhe seksione për portofolin, kontaktin dhe blogun e vetë kompanisë.
design: >-
  Fotografi në gjithë gjerësinë e ekranit të fasadës së stadiumit, tituj të ngjeshur me shkronja kapitale dhe
  një paletë e përmbajtur bardh e zi me të kuqe, që i bën jehonë ndërtesës. Panele interaktive zbulojnë
  secilën pjesë të kompleksit pa u larguar nga faqja.
development: >-
  Një ndërtim në WordPress që i jep ekipit kontroll mbi projektet, lajmet dhe mediat, me performancë të
  optimizuar për imazhe të mëdha dhe konfigurim SEO për kërkimet e pronave. IR-në e mbështesim edhe me
  reklama dhe rrjete sociale.
result: >-
  IR ka një faqe që i përshtatet shkallës së pronave që menaxhon dhe që i jep çdo publiku një rrugë të
  drejtpërdrejtë te hapësira që i intereson.
highlights:
  - Tregim përmes imazhit për një kompleks emblematik
  - Histori të veçanta për hapësirën tregtare, stadiumin, hotelin dhe zyrat
  - Portofol dhe blog të menaxhuar në WordPress
  - Pjesë e familjes së faqeve të Finman Group
