key: albstar
lang: sq
industry: Ndërtim dhe infrastrukturë
location: Tiranë, Shqipëri
summary: >-
  Një vitrinë dygjuhëshe projektesh për një kompani ndërtimi që qëndron pas disa prej veprave më të njohura
  të infrastrukturës në Shqipëri.
metaDescription: >-
  Rast studimi — faqe dygjuhëshe për Albstar, kompani shqiptare ndërtimi dhe infrastrukture. Vitrinë
  projektesh, WordPress, SEO, reklama dhe rrjete sociale.
overview: >-
  Albstar është një kompani shqiptare ndërtimi dhe infrastrukture, pjesë e Finman Group. Portofoli i saj
  përfshin Air Albania Stadium në Tiranë, infrastrukturë rrugore dhe hidroenergjetike, punime hekurudhore,
  landfill-e, rrjete kanalizimesh dhe restaurimin e ndërtesave historike.
challenge: >-
  Klientët e infrastrukturës dhe institucionet publike i gjykojnë kontraktorët nga përvoja e tyre. Faqja
  duhej të paraqiste me besueshmëri projekte të mëdha dhe teknikisht komplekse për profesionistët — në shqip
  dhe në anglisht — dhe t’i lidhte vizitorët me grupin më të gjerë.
approach: >-
  Projektet janë thelbi i faqes. Secili ka një titull të qartë, një përshkrim të përmbledhur dhe imazhe të
  fuqishme, duke nisur me një vitrinë në ekran të plotë të veprave kryesore në kryefaqe. Një menu e grupit
  lidhet drejtpërdrejt me kompanitë e tjera të Finman Group.
design: >-
  Bluja mbretërore e Albstar dhe ylli i verdhë i logos, fotografi të mëdha ajrore dhe kantieresh, si dhe një
  sistem tipografik korporativ i pastër që e mban vëmendjen te puna.
development: >-
  Një temë WordPress me porosi, me përmbajtje në shqip dhe anglisht, që ekipi të mund të shtojë projekte dhe
  lajme në të dyja gjuhët. Paralelisht ofrojmë mbështetje për SEO dhe fushata.
result: >-
  Albstar e paraqet portofolin e projekteve në dy gjuhë, në një faqe që ekipi i vet e mban të përditësuar
  sa herë përfundon një punë e re.
highlights:
  - Vitrinë në ekran të plotë e projekteve kryesore
  - Përmbajtje në shqip dhe anglisht
  - Temë WordPress me porosi
  - E lidhur me familjen e faqeve të Finman Group
