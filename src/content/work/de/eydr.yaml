key: eydr
lang: de
industry: Forschung & Politikberatung – EU-gefördertes Projekt
location: Westbalkan
summary: >-
  Die Website von EYDR, einem von SCiDEV geleiteten Projekt zur Beteiligung junger Menschen an der digitalen
  Demokratie im Westbalkan – von digitalen Kompetenzen bis zu digitalen Rechten.
metaDescription: >-
  Fallstudie – Website für EYDR (Youth Digital Rights), ein EU-gefördertes Projekt unter Leitung von SCiDEV im
  Westbalkan. WordPress, SEO, Werbung und Social Media.
overview: >-
  EYDR – Youth Digital Rights – will junge Menschen in der digitalen Welt einbinden und stärken, indem es ihre
  digitalen Kompetenzen ausbaut und das Bewusstsein für ihre digitalen Rechte schärft. Das Projekt wird von
  SCiDEV geleitet, von der Europäischen Union gefördert und vereint ein Konsortium aus sieben Institutionen aus
  vier Ländern.
challenge: >-
  Projektwebsites müssen mehrere Zielgruppen zugleich bedienen – junge Menschen, Partnerorganisationen und den
  Fördergeber – und dessen Sichtbarkeitsvorgaben erfüllen. Zudem müssen sie schnell online gehen und für ein
  Projektteam einfach zu aktualisieren sein, wenn Arbeitspakete, Veranstaltungen und Ergebnisse hinzukommen.
approach: >-
  Wir haben die Website entlang der Projektorganisation strukturiert: was EYDR ist, die Partner, die
  Arbeitspakete und die News. Partner- und Fördergeber-Branding steht, wie es die EU-Sichtbarkeitsrichtlinien
  verlangen, prominent im Header, und jede Seite führt auf natürliche Weise zum Zweck des Projekts zurück.
design: >-
  Eine helle, digitale Bildsprache im Blau von EYDR, die an die Marke von SCiDEV anknüpft – mit klarer Navigation
  und einem Hero-Bereich, der den Schwerpunkt des Projekts in einer Zeile benennt: die Beteiligung junger
  Menschen an der digitalen Demokratie.
development: >-
  Umgesetzt mit WordPress und Elementor, damit das Projektteam News veröffentlichen und die Seiten der
  Arbeitspakete ohne Entwickler aktualisieren kann – auf derselben Plattformbasis wie die Hauptwebsite von
  SCiDEV. SEO, Werbung und Social Media laufen begleitend.
result: >-
  EYDR hat ein eigenes, leicht zu pflegendes Zuhause für das Projekt, das die Sichtbarkeitsvorgaben des
  Fördergebers erfüllt und Partnern wie jungen Menschen einen zentralen Ort bietet, um die Arbeit zu verfolgen.
highlights:
  - Projektstruktur – Partner, Arbeitspakete, News
  - Sichtbarkeit von EU-Fördergeber und Partnern direkt im Header
  - Eigenständiges Publizieren mit WordPress und Elementor
  - Visuelle Verbindung zur Hauptwebsite von SCiDEV
