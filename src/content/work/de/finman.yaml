key: finman
lang: de
industry: Holding – Bau, Beschaffung, Transport, Immobilien
location: Tirana, Albanien
summary: >-
  Die Unternehmenswebsite der Finman Group, Muttergesellschaft von Unternehmen aus Bau, Beschaffung,
  Schienenverkehr und Immobilien.
metaDescription: >-
  Fallstudie – Website der Finman Group in Tirana, die ihre Firmen aus Bau, Beschaffung,
  Transport und Immobilien bündelt. Web, SEO, Werbung, Social Media.
overview: >-
  Die Finman Group erbringt branchenspezifische Leistungen für öffentliche und private Auftraggeber – über
  ein Portfolio von Unternehmen, darunter Albstar, Fintrade und IR Real Estate. Ihre Tätigkeit umfasst Bau,
  Beschaffung, Schienenverkehr, Immobilien und Dienstleistungen.
challenge: >-
  Eine Holding muss etwas Abstraktes erklären – was die Gruppe eigentlich ist – und zugleich jedem
  Unternehmen seinen eigenen Platz geben. Die Website sollte für Partner, öffentliche Auftraggeber und
  Bewerber funktionieren und als zentraler Knotenpunkt mehrere Unternehmenswebsites verbinden.
approach: >-
  Wir haben die Website um vier Fragen herum aufgebaut: Wer ist die Gruppe, was gehört dazu, was gibt es
  Neues und wie arbeitet man mit ihr zusammen? Ein Portfoliobereich stellt jedes Unternehmen vor und
  verlinkt auf dessen eigene Website; Newsroom und Karrierebereich richten sich an Presse und Bewerber.
design: >-
  Das tiefe Marineblau und der gelbe Akzent aus dem Finman-Logo, eine selbstbewusste Hero-Aussage und
  praktische Angaben – Adresse, Öffnungszeiten, E-Mail und Telefon –, die in der oberen Leiste stets
  sichtbar sind.
development: >-
  Eine WordPress-Website, die das Team der Gruppe direkt pflegt und die Bildsprache und Navigationsmuster
  mit den Websites der Tochtergesellschaften teilt. Suchmaschinenoptimierung, Werbung und Social Media
  betreuen wir weiterhin.
result: >-
  Die Finman Group hat eine zentrale Website, die die Gruppe klar darstellt und Besucher zu jedem ihrer
  Unternehmen weiterleitet.
highlights:
  - Zentrale Gruppenwebsite mit Links zu allen Unternehmenswebsites
  - Portfolio, Newsroom und Karrierebereich
  - Kontaktdaten und Öffnungszeiten auf jeder Seite sichtbar
  - Einheitliche Bildsprache über alle Websites der Gruppe
