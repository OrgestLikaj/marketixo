key: fintrade
lang: de
industry: Beschaffung & Industriebedarf
location: Tirana, Albanien
summary: >-
  Eine zweisprachige Website für ein Beschaffungsunternehmen, das Lösungen für Infrastruktur, Energie,
  Wasser und Maschinen in Albanien und im Kosovo liefert.
metaDescription: >-
  Fallstudie – zweisprachige Website für Fintrade, Beschaffungsspezialist aus Tirana für Infrastruktur-,
  Energie- und Wasserprojekte. WordPress, SEO, Werbung, Social Media.
overview: >-
  Fintrade ist ein Beschaffungsunternehmen in Tirana und Teil der Finman Group. Es liefert Produkte und
  Lösungen für Tief- und Infrastrukturbau, Maschinen und Ausrüstung, Energie sowie Wasser- und
  Abwasseraufbereitung an Kunden in Albanien und im Kosovo.
challenge: >-
  Beschaffung ist ein Geschäft, das auf Vertrauen und Sortimentsbreite beruht. Ingenieure und Einkäufer
  müssen schnell sehen, welche Branchen Fintrade bedient, was das Unternehmen bereits geliefert hat und wer
  ihr Ansprechpartner ist – auf Albanisch oder Englisch.
approach: >-
  Die Website ist nach den Branchen gegliedert, die Fintrade bedient, ergänzt um einen Projektbereich und
  eine klare Unternehmensgeschichte. Ein Recruiting-Hinweis in der oberen Leiste unterstützt die
  Personalsuche neben den kommerziellen Inhalten.
design: >-
  Ein heller, architektonischer Look in Fintrades Indigo und Orange, mit großer Hero-Aussage, Bildern von
  Glas und Stahl und übersichtlichen Branchenseiten.
development: >-
  Umgesetzt mit WordPress, mit albanischer und englischer Version, die das Team selbst pflegt – begleitet
  von laufender Betreuung in SEO, Werbung und Social Media.
result: >-
  Fintrade präsentiert seine Branchen, Projekte und sein Team in zwei Sprachen auf einer Website, die die
  Mitarbeitenden selbst verwalten.
highlights:
  - Eigene Seiten für jede bediente Branche
  - Inhalte auf Albanisch und Englisch
  - Projekt- und Karrierebereich
  - Teil der Website-Familie der Finman Group
