key: albstar
lang: de
industry: Bau & Infrastruktur
location: Tirana, Albanien
summary: >-
  Ein zweisprachiges Projektportfolio für ein Bauunternehmen, das hinter einigen der wichtigsten
  Infrastrukturprojekte Albaniens steht.
metaDescription: >-
  Fallstudie – zweisprachige Website für Albstar, ein albanisches Bau- und Infrastrukturunternehmen.
  Projektportfolio, WordPress, SEO, Werbung und Social Media.
overview: >-
  Albstar ist ein albanisches Bau- und Infrastrukturunternehmen und gehört zur Finman Group. Zum Portfolio
  zählen das Air Albania Stadium in Tirana, Straßen- und Wasserkraftinfrastruktur, Bahnbauprojekte,
  Deponien, Abwassernetze sowie die Restaurierung historischer Gebäude.
challenge: >-
  Infrastrukturkunden und öffentliche Auftraggeber beurteilen Bauunternehmen nach ihren Referenzen. Die
  Website musste große, technisch komplexe Projekte für ein Fachpublikum glaubwürdig präsentieren – auf
  Albanisch und Englisch – und Besucher mit der gesamten Unternehmensgruppe verbinden.
approach: >-
  Die Projekte bilden den Kern der Website. Jedes erhält einen klaren Titel, eine knappe Beschreibung und
  starke Bilder – angefangen mit einer bildschirmfüllenden Präsentation der wichtigsten Projekte auf der
  Startseite. Ein Gruppenmenü verlinkt direkt auf die anderen Unternehmen der Finman Group.
design: >-
  Das Königsblau und der gelbe Stern aus dem Albstar-Logo, große Luft- und Baustellenaufnahmen und ein
  klares, seriöses Schriftsystem, das den Fokus auf die Arbeit legt.
development: >-
  Ein individuelles WordPress-Theme mit albanischen und englischen Inhalten, damit das Team Projekte und
  News in beiden Sprachen selbst ergänzen kann. Begleitend laufen SEO und Kampagnenbetreuung.
result: >-
  Albstar präsentiert seine Projekte in zwei Sprachen auf einer Website, die das eigene Team aktuell hält,
  sobald neue Projekte abgeschlossen sind.
highlights:
  - Bildschirmfüllende Präsentation der wichtigsten Projekte
  - Inhalte auf Albanisch und Englisch
  - Individuelles WordPress-Theme
  - Eingebunden in die Website-Familie der Finman Group
