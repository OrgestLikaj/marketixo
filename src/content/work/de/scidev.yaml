key: scidev
lang: de
industry: Forschung & Politikberatung – Thinktank
location: Tirana, Albanien
summary: >-
  Eine Publikationsplattform für einen Thinktank aus Tirana, der zu Medienfreiheit, zivilgesellschaftlichem
  Handlungsraum und Wissenschaft im Westbalkan arbeitet.
metaDescription: >-
  Fallstudie – Website für SCiDEV, einen Thinktank in Tirana mit Studien, Policy Papers und News zu
  Medienfreiheit und Zivilgesellschaft. Web, SEO, Werbung, Social Media.
overview: >-
  SCiDEV – das Center for Science and Innovation for Development – ist ein Thinktank mit Sitz in Tirana. Er
  veröffentlicht Studien, Indizes und Positionspapiere zu Medienfreiheit, der Sicherheit von Journalisten,
  zivilgesellschaftlichem Handlungsraum und demokratischer Regierungsführung und betreibt Programme wie
  NAWSTEM für Frauen in der Wissenschaft.
challenge: >-
  Die Website eines Thinktanks ist Bibliothek, Newsroom und Visitenkarte zugleich. Publikationen, News und
  Veranstaltungen kommen laufend hinzu, viele davon gemeinsam mit internationalen Partnern und Geldgebern,
  deren Branding berücksichtigt werden muss. Das Team musste ohne Entwickler schnell veröffentlichen können,
  und Leser mussten einen bestimmten Bericht in jahrelang gewachsenem Material finden.
approach: >-
  Wir haben die Website entlang der Arbeit der Organisation strukturiert – Themenschwerpunkte,
  Publikationen, News und Programme –, sodass jeder neue Beitrag einen klaren Platz hat. Die Startseite
  stellt aktuelle Workshops und die neuesten Publikationen nach vorn und bringt die jüngste Arbeit so vor
  Journalisten, Partner und politische Entscheidungsträger.
design: >-
  Ein redaktionelles Layout im tiefen Indigo von SCiDEV mit dem leuchtenden, mehrfarbigen Akzent des Logos.
  Publikationscover erscheinen als große Karten, damit Berichte auf einen Blick erkennbar sind – mit klaren
  Daten und Kategorien.
development: >-
  Umgesetzt mit WordPress, damit das Kommunikationsteam Publikationen, News und Veranstaltungen selbstständig
  veröffentlichen kann. Eine websiteweite Suche, klare Kategorien und Social Sharing helfen, dass Berichte
  ihr Publikum erreichen; die Website ist für Suchmaschinen optimiert und wird von den Social-Media-Kanälen
  und Kampagnen der Organisation begleitet.
result: >-
  SCiDEV veröffentlicht Forschung und News auf einer Website, die das eigene Team im Alltag verwaltet – mit
  einer Struktur, die ein wachsendes Publikationsarchiv auffindbar hält.
highlights:
  - Publikationen, News und Veranstaltungen nach Themenschwerpunkten geordnet
  - Eigenständiges Publizieren für das Kommunikationsteam
  - Partner- und Geldgeber-Branding pro Publikation
  - Suche und Kategorien über ein wachsendes Archiv
