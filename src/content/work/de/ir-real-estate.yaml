key: ir-real-estate
lang: de
industry: Immobilien & Immobilienverwaltung
location: Tirana, Albanien
summary: >-
  Eine ausdrucksstarke, bildgeführte Website für das Unternehmen hinter dem Arena Center – dem
  gemischt genutzten Komplex rund um das Air Albania Stadium in Tirana.
metaDescription: >-
  Fallstudie – Website für IR Real Estate & Management, das Unternehmen hinter dem Arena Center in Tirana.
  Bildstarkes Design, WordPress, SEO, Werbung und Social Media.
overview: >-
  IR Real Estate & Management verwaltet das Arena Center in Tirana – einen Komplex aus Air Albania Stadium,
  Marriott-Hotel, Einkaufszentrum und Büroflächen – und vermarktet Wohnprojekte wie die Altana Luxury
  Residence. IR gehört zur Finman Group.
challenge: >-
  Vor Ort beeindruckt die Immobilie von selbst – online musste die Website diese Wirkung erzeugen.
  Verschiedene Zielgruppen – Gewerbemieter, Bürokunden, Besucher und Kaufinteressenten – sollten schnell ihren
  Teil des Komplexes finden, ohne dass die Website zu einer Broschüre aus unverbundenen Seiten wird.
approach: >-
  Wir haben der Architektur die Führung überlassen. Großformatige Fotografie stellt den Komplex vor,
  gefolgt von einer klaren Gliederung seiner Bereiche – Gewerbeflächen, Stadion, Hotel und Büros –, jeder
  mit einer eigenen kurzen Geschichte. Dazu kommen Portfolio, Kontakt und Blog für das Unternehmen selbst.
design: >-
  Randlose Fotografie der Stadionfassade, schmale Headlines in Großbuchstaben und eine zurückhaltende
  Palette aus Schwarz, Weiß und Rot, die das Gebäude aufgreift. Interaktive Panels zeigen jeden Bereich des
  Komplexes, ohne dass man die Seite verlassen muss.
development: >-
  Eine WordPress-Umsetzung, mit der das Team Projekte, News und Medien selbst verwaltet – mit auf große
  Bilder abgestimmter Performance und einem SEO-Setup für Immobiliensuchen. Zusätzlich betreuen wir IR bei
  Werbung und Social Media.
result: >-
  IR hat eine Website, die der Größe der verwalteten Immobilien gerecht wird und jeder Zielgruppe einen
  direkten Weg zu den Flächen bietet, die sie interessieren.
highlights:
  - Bildgeführtes Storytelling für einen Komplex mit Wahrzeichencharakter
  - Eigene Geschichten für Gewerbeflächen, Stadion, Hotel und Büros
  - Portfolio und Blog in WordPress verwaltet
  - Teil der Website-Familie der Finman Group
