key: albanian-athletes
lang: de
industry: Sport – Nachwuchsförderung
location: Vereinigtes Königreich & Albanien
summary: >-
  Eine Website für die Albanian Athletes Group, die junge albanische Fußballer mit Entwicklungswegen, Profilen
  und Kontakten zu internationalen Möglichkeiten unterstützt.
metaDescription: >-
  Fallstudie – Website für die Albanian Athletes Group: Entwicklungswege, Spielerprofile, Erfolgsgeschichten und
  Spenden. WordPress, SEO, Werbung und Social Media.
overview: >-
  Die 2020 gegründete Albanian Athletes Group (AAG) unterstützt albanische Sportler – vor allem junge Fußballer –
  mit Entwicklungsmöglichkeiten, Talentsichtung sowie Kontakten zu Vereinen und internationalen Chancen. Sie ist
  vom Vereinigten Königreich aus tätig, in Partnerschaft mit Carshalton Athletic.
challenge: >-
  AAG spricht sehr unterschiedliche Zielgruppen an: junge Spieler und ihre Familien, Vereine und Scouts sowie
  Unterstützer, die möglicherweise spenden. Die Website musste die Ersten begeistern, die Zweiten informieren und
  den Dritten einen klaren Weg zur Unterstützung bieten – und die Spieler dabei glaubwürdig präsentieren.
approach: >-
  Wir haben die Website entlang des Wegs der Sportler aufgebaut: wer AAG ist, Spielerprofile, strukturierte
  Entwicklungswege, Erfolgsgeschichten, Beratung und News – mit Kontaktdaten und einem gut sichtbaren
  Spenden-Button, die stets in Reichweite sind.
design: >-
  Große, emotionale Fußballfotografie mit kurzen Aussagen darauf, das rote Wappen der AAG und ein klares,
  sportliches Layout, das Profile und Entwicklungswege leicht erfassbar macht.
development: >-
  Umgesetzt mit WordPress und WPBakery, damit das Team Profile, Geschichten und News selbst aktualisieren kann,
  und über Site Kit mit Google-Diensten verbunden – für Einblicke in Suche und Analytics. SEO, Werbung und Social
  Media laufen begleitend.
result: >-
  Die Albanian Athletes Group hat eine Website, die ihre Spieler und Programme gegenüber Vereinen und Familien
  glaubwürdig präsentiert und Unterstützern einen direkten Weg bietet, einen Beitrag zu leisten.
highlights:
  - Spielerprofile, Entwicklungswege und Erfolgsgeschichten
  - Spenden-Call-to-Action im Header
  - Eigenständig gepflegte Inhalte in WordPress
  - Google Site Kit für Einblicke in Suche und Analytics
