key: ir-real-estate
lang: it
industry: Immobiliare e property management
location: Tirana, Albania
summary: >-
  Un sito d’impatto, guidato dalle immagini, per la società che gestisce Arena Center — il complesso
  multifunzionale attorno all’Air Albania Stadium di Tirana.
metaDescription: >-
  Caso studio — sito web per IR Real Estate & Management, la società dietro l’Arena Center di Tirana. Design
  guidato dalle immagini, WordPress, SEO, ads e social media.
overview: >-
  IR Real Estate & Management gestisce Arena Center a Tirana — un complesso che riunisce l’Air Albania Stadium,
  un hotel Marriott, un centro commerciale e uffici — e commercializza progetti residenziali come Altana Luxury
  Residence. IR fa parte di Finman Group.
challenge: >-
  Dal vivo, la struttura colpisce da sola; online doveva riuscirci il sito. Pubblici diversi — affittuari,
  aziende in cerca di uffici, visitatori e acquirenti — dovevano trovare rapidamente la parte del complesso che
  li riguarda, senza che il sito diventasse una brochure di pagine scollegate.
approach: >-
  Abbiamo lasciato che fosse l’architettura a guidare. Grandi fotografie introducono il complesso, seguite da
  una presentazione chiara delle sue componenti — spazi commerciali, stadio, hotel e uffici — ciascuna con un
  breve racconto, oltre alle sezioni portfolio, contatti e blog dedicate alla società.
design: >-
  Fotografie a tutta pagina della facciata dello stadio, titoli in maiuscolo condensato e una palette sobria di
  nero, bianco e rosso che richiama l’edificio. Pannelli interattivi mostrano ogni parte del complesso senza
  lasciare la pagina.
development: >-
  Uno sviluppo WordPress che dà al team il controllo su progetti, notizie e media, con performance ottimizzate
  per immagini di grandi dimensioni e una configurazione SEO pensata per le ricerche immobiliari. Supportiamo IR
  anche con pubblicità e social media.
result: >-
  IR ha un sito all’altezza delle proprietà che gestisce, che offre a ogni pubblico un percorso diretto verso lo
  spazio di suo interesse.
highlights:
  - Storytelling per immagini per un complesso simbolo
  - Racconti distinti per spazi commerciali, stadio, hotel e uffici
  - Portfolio e blog gestiti in WordPress
  - Parte della rete di siti di Finman Group
