key: finman
lang: it
industry: Holding — edilizia, approvvigionamenti, trasporti, immobiliare
location: Tirana, Albania
summary: >-
  Il sito istituzionale di Finman Group, capogruppo di società attive nell’edilizia, negli approvvigionamenti,
  nel trasporto ferroviario e nell’immobiliare.
metaDescription: >-
  Caso studio — sito istituzionale di Finman Group a Tirana, che collega le società attive in edilizia,
  approvvigionamenti, trasporti e immobiliare. Web, SEO, ads, social.
overview: >-
  Finman Group offre servizi specializzati per settore a clienti pubblici e privati attraverso un portfolio di
  società che comprende Albstar, Fintrade e IR Real Estate. Le sue attività spaziano dall’edilizia agli
  approvvigionamenti, dal trasporto ferroviario all’immobiliare e ai servizi.
challenge: >-
  Una holding deve spiegare qualcosa di astratto — che cos’è il gruppo — lasciando a ciascuna società il
  proprio spazio. Il sito doveva funzionare per partner, clienti del settore pubblico e candidati, e fare da
  snodo tra i siti delle diverse società.
approach: >-
  Abbiamo costruito il sito attorno a quattro domande — chi è il gruppo, che cosa possiede, quali sono le
  novità e come collaborare. Una sezione portfolio presenta ogni società e rimanda al suo sito, mentre le
  sezioni newsroom e lavora con noi si rivolgono a stampa e candidati.
design: >-
  Il blu notte di Finman e l’accento giallo del logo, con un messaggio d’apertura deciso e informazioni
  pratiche — indirizzo, orari, e-mail e telefono — sempre visibili nella barra superiore.
development: >-
  Un sito WordPress che il team del gruppo aggiorna direttamente, con linguaggio visivo e schemi di navigazione
  condivisi con i siti delle controllate. Prosegue il supporto per SEO, pubblicità e social media.
result: >-
  Finman Group dispone di un sito centrale che presenta il gruppo con chiarezza e indirizza i visitatori verso
  ciascuna delle sue società.
highlights:
  - Hub del gruppo con link al sito di ogni società
  - Sezioni portfolio, newsroom e lavora con noi
  - Contatti e orari visibili in ogni pagina
  - Linguaggio visivo condiviso tra i siti del gruppo
