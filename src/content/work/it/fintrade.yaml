key: fintrade
lang: it
industry: Approvvigionamenti e forniture industriali
location: Tirana, Albania
summary: >-
  Un sito bilingue per una società di approvvigionamenti che fornisce soluzioni per infrastrutture, energia,
  acqua e macchinari in Albania e Kosovo.
metaDescription: >-
  Caso studio — sito bilingue per Fintrade, società di approvvigionamenti di Tirana per progetti
  infrastrutturali, energetici e idrici. WordPress, SEO, ads e social.
overview: >-
  Fintrade è una società di approvvigionamenti con sede a Tirana e fa parte di Finman Group. Fornisce prodotti
  e soluzioni per opere civili e infrastrutture, macchinari e attrezzature, energia e trattamento delle acque e
  delle acque reflue a clienti in Albania e Kosovo.
challenge: >-
  Gli approvvigionamenti sono un business fondato sulla fiducia e sull’ampiezza dell’offerta. Ingegneri e
  buyer devono capire subito in quali settori opera Fintrade, che cosa ha realizzato e a chi rivolgersi — in
  albanese o in inglese.
approach: >-
  Il sito è organizzato in base ai settori serviti da Fintrade, affiancati da una sezione progetti e da una
  presentazione chiara dell’azienda. Un messaggio di recruiting nella barra superiore sostiene le assunzioni
  accanto ai contenuti commerciali.
design: >-
  Un look luminoso e architettonico nei colori indaco e arancio di Fintrade, con un grande messaggio
  d’apertura, immagini di vetro e acciaio e pagine di settore essenziali.
development: >-
  Realizzato su WordPress, con versioni in albanese e in inglese gestite direttamente dal team e supportate da
  attività continuative di SEO, pubblicità e social media.
result: >-
  Fintrade presenta settori, progetti e team in due lingue su un sito che il personale gestisce in autonomia.
highlights:
  - Pagine dedicate a ciascun settore servito
  - Contenuti in albanese e in inglese
  - Sezioni progetti e lavora con noi
  - Parte della rete di siti di Finman Group
