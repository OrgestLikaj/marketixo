key: albstar
lang: it
industry: Edilizia e infrastrutture
location: Tirana, Albania
summary: >-
  Un sito bilingue che presenta i progetti di un’impresa di costruzioni artefice di alcune delle infrastrutture
  simbolo dell’Albania.
metaDescription: >-
  Caso studio — sito web bilingue per Albstar, impresa albanese di costruzioni e infrastrutture. Vetrina dei
  progetti, WordPress, SEO, pubblicità e social media.
overview: >-
  Albstar è un’impresa albanese di costruzioni e infrastrutture che fa parte di Finman Group. Il suo portfolio
  comprende l’Air Albania Stadium di Tirana, infrastrutture stradali e idroelettriche, opere ferroviarie,
  discariche, reti fognarie e il restauro di edifici storici.
challenge: >-
  Committenti del settore infrastrutturale ed enti pubblici valutano le imprese in base ai lavori già
  realizzati. Il sito doveva presentare in modo credibile a un pubblico di professionisti progetti grandi e
  tecnicamente complessi — in albanese e in inglese — e collegare i visitatori al resto del gruppo.
approach: >-
  I progetti sono il cuore del sito. Ognuno ha un titolo chiaro, una descrizione concisa e immagini d’impatto,
  a partire da una vetrina a tutto schermo dei lavori principali in home page. Un menu dedicato al gruppo
  rimanda direttamente alle altre società di Finman Group.
design: >-
  Il blu reale di Albstar e la stella gialla del logo, grandi fotografie aeree e di cantiere e un sistema
  tipografico istituzionale e pulito che mantiene l’attenzione sui lavori.
development: >-
  Un tema WordPress su misura con contenuti in albanese e in inglese, che permette al team di aggiungere
  progetti e notizie in entrambe le lingue. In parallelo, supporto SEO e campagne.
result: >-
  Albstar presenta i propri lavori in due lingue su un sito che il team aggiorna man mano che nuovi progetti
  vengono completati.
highlights:
  - Vetrina a tutto schermo dei progetti principali
  - Contenuti in albanese e in inglese
  - Tema WordPress su misura
  - Integrato nella rete di siti di Finman Group
