key: albstar
lang: en
industry: Construction & infrastructure
location: Tirana, Albania
summary: >-
  A bilingual project showcase for a construction company behind some of Albania's landmark infrastructure.
metaDescription: >-
  Case study — bilingual website for Albstar, an Albanian construction and infrastructure company. Project
  showcase, WordPress, SEO, ads and social media.
overview: >-
  Albstar is an Albanian construction and infrastructure company and part of Finman Group. Its portfolio
  includes the Air Albania Stadium in Tirana, road and hydropower infrastructure, railway works, landfills,
  sewage networks and the restoration of historic buildings.
challenge: >-
  Infrastructure clients and public institutions judge contractors on their track record. The website had to
  present large, technically complex projects credibly for professionals — in Albanian and English — and
  connect visitors to the wider group.
approach: >-
  Projects are the core of the site. Each one gets a clear title, a concise description and strong imagery,
  starting with a full-screen showcase of flagship work on the home page. A group menu links directly to the
  other Finman Group companies.
design: >-
  Albstar's royal blue and the yellow star from its logo, large aerial and construction photography, and a
  clean corporate type system that keeps the focus on the work.
development: >-
  A custom WordPress theme with Albanian and English content, so the team can add projects and news in both
  languages. SEO and campaign support run alongside.
result: >-
  Albstar presents its project record in two languages on a site its team keeps up to date as new work is
  completed.
highlights:
  - Full-screen showcase of flagship projects
  - Albanian and English content
  - Custom WordPress theme
  - Linked into the Finman Group family of sites
