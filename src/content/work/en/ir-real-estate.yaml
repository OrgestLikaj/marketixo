key: ir-real-estate
lang: en
industry: Real estate & property management
location: Tirana, Albania
summary: >-
  A bold, image-led website for the company behind Arena Center — the mixed-use complex around Tirana's
  Air Albania Stadium.
metaDescription: >-
  Case study — website for IR Real Estate & Management, the company behind Tirana's Arena Center. Image-led
  design, WordPress build, SEO, ads and social media.
overview: >-
  IR Real Estate & Management manages Arena Center in Tirana — a complex combining the Air Albania Stadium, a
  Marriott hotel, a commercial centre and offices — and markets residential developments such as Altana Luxury
  Residence. IR is part of Finman Group.
challenge: >-
  The property makes its impression in person; the website had to make it online. Different audiences —
  tenants, office clients, visitors and buyers — each needed to find their part of the complex quickly,
  without the site turning into a brochure of disconnected pages.
approach: >-
  We let the architecture lead. Large photography introduces the complex, followed by a clear breakdown of its
  parts — commercial space, stadium, hotel and offices — each with its own short story, plus portfolio,
  contact and blog sections for the company itself.
design: >-
  Full-bleed photography of the stadium façade, condensed uppercase headlines and a restrained black, white
  and red palette that echoes the building. Interactive panels reveal each part of the complex without
  leaving the page.
development: >-
  A WordPress build that gives the team control over projects, news and media, with performance tuned for
  large imagery and an SEO setup for property searches. We also support IR with ads and social media.
result: >-
  IR has a website that matches the scale of the properties it manages and gives each audience a direct route
  to the space it is interested in.
highlights:
  - Image-led storytelling for a landmark complex
  - Separate stories for commercial space, stadium, hotel and offices
  - Portfolio and blog managed in WordPress
  - Part of a family of Finman Group websites
