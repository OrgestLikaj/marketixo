key: fintrade
lang: en
industry: Procurement & industrial supply
location: Tirana, Albania
summary: >-
  A bilingual website for a procurement company supplying infrastructure, power, water and machinery
  solutions in Albania and Kosovo.
metaDescription: >-
  Case study — bilingual website for Fintrade, a Tirana procurement company serving infrastructure, power and
  water projects. WordPress, SEO, ads and social media.
overview: >-
  Fintrade is a procurement company in Tirana and part of Finman Group. It supplies products and solutions for
  civil works and infrastructure, machinery and equipment, power, and water and wastewater treatment to
  clients in Albania and Kosovo.
challenge: >-
  Procurement is a business of trust and range. Engineers and buyers need to see quickly which industries
  Fintrade serves, what it has delivered and whom to contact — in Albanian or English.
approach: >-
  The site is organised by the industries Fintrade serves, backed by a projects section and a clear company
  story. A recruitment message in the top bar supports hiring alongside the commercial content.
design: >-
  A light, architectural look in Fintrade's indigo and orange, with a large hero statement, glass-and-steel
  imagery and clean industry pages.
development: >-
  Built on WordPress with Albanian and English versions the team maintains itself, supported by ongoing SEO,
  ads and social media.
result: >-
  Fintrade presents its industries, projects and team in two languages on a site its staff manage themselves.
highlights:
  - Industry pages for each sector served
  - Albanian and English content
  - Projects and careers sections
  - Part of the Finman Group family of sites
