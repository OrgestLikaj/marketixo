key: finman
lang: en
industry: Holding group — construction, procurement, transport, real estate
location: Tirana, Albania
summary: >-
  The corporate website of Finman Group, parent of companies in construction, procurement, railway transport
  and real estate.
metaDescription: >-
  Case study — corporate website for Finman Group in Tirana, connecting its companies in construction,
  procurement, transport and real estate. Web, SEO, ads, social.
overview: >-
  Finman Group provides industry-focused services to public and private clients through a portfolio of
  companies including Albstar, Fintrade and IR Real Estate. Its activities span construction, procurement,
  railway transport, real estate and services.
challenge: >-
  A holding company has to explain something abstract — what the group is — while giving each company its own
  place. The site needed to work for partners, public-sector clients and job seekers, and act as the hub that
  connects several company websites.
approach: >-
  We built the site around four questions — who the group is, what it owns, what is new and how to work with
  it. A portfolio section introduces each company and links to its own website, while newsroom and careers
  sections serve press and applicants.
design: >-
  Finman's deep navy and the yellow accent of its logo, with a confident hero statement and practical details —
  address, opening hours, email and phone — always visible in the top bar.
development: >-
  A WordPress site the group's team updates directly, sharing visual language and navigation patterns with
  the subsidiaries' websites. Search optimisation, ads and social media support continue.
result: >-
  Finman Group has a central website that presents the group clearly and connects visitors to each of its
  companies.
highlights:
  - Group hub linking to each company website
  - Portfolio, newsroom and careers sections
  - Contact details and hours visible on every page
  - Shared visual language across the group's sites
