key: social-media-marketing
lang: en
title: Social Media Marketing
shortTitle: Social Media
tagline: Consistent, on-brand social channels that build an audience.
metaTitle: Social Media Marketing & Management | Marketixo
metaDescription: Social media strategy, content planning, account management and campaigns for Instagram, Facebook and LinkedIn — consistent, on-brand and measured.
hero:
  eyebrow: Service 05 — Grow
  headline: Show up consistently. Sound like yourself.
  lead: We plan, create and manage social content that keeps your brand present and recognisable — and turns followers into customers.
problem:
  heading: Social media is easy to start and hard to sustain.
  intro: Most business accounts begin with energy and fade within weeks.
  points:
    - title: Posting without a plan
      text: Content is created at the last minute, so it’s inconsistent in quality and message.
    - title: Off-brand visuals
      text: Every post looks different, and the feed doesn’t build recognition.
    - title: No link to business goals
      text: Likes are counted, but nobody knows whether social brings in customers.
solution:
  heading: A plan, a look and a rhythm.
  text: We define what your channels are for, build a visual and editorial system around your brand, and run a predictable publishing calendar — with reporting tied to real goals.
  pillars:
    - title: Strategy
      text: Channels, audiences, content pillars and goals agreed upfront.
    - title: Production
      text: Templates, photography direction, short video and copy in your voice.
    - title: Community
      text: Replies, messages and engagement handled promptly and politely.
included:
  heading: What’s included
  items:
    - title: Social media strategy
      text: Channel choice, content pillars, tone of voice and measurable goals.
    - title: Content planning
      text: A monthly editorial calendar you approve before anything is published.
    - title: Account management
      text: Publishing, profile optimisation and day-to-day account care.
    - title: Campaigns
      text: Launches, promotions and seasonal campaigns across organic and paid.
    - title: Community growth
      text: Engagement, collaborations and audience-building tactics.
    - title: Creative production
      text: Post templates, carousels, stories, reels and simple motion graphics.
process:
  heading: How it works
  steps:
    - title: Audit & strategy
      text: Where you are, where your audience is, what to say.
    - title: Brand kit for social
      text: Templates and guidelines that keep every post on-brand.
    - title: Monthly calendar
      text: Planned, produced and approved a month ahead.
    - title: Report & refine
      text: Monthly insights and adjustments based on what performs.
benefits:
  heading: What you get
  items:
    - title: Consistency
      text: A regular, recognisable presence without daily effort from your team.
    - title: Time back
      text: Planning, creation and publishing handled for you.
    - title: Insight
      text: Clear monthly reports on reach, engagement and enquiries.
faq:
  - q: Which platforms do you manage?
    a: Mainly Instagram, Facebook and LinkedIn. We recommend focusing on the two or three channels where your audience actually is.
  - q: Do we approve posts before they go live?
    a: Yes. You see and approve the monthly calendar before anything is published.
  - q: Do you produce photos and videos?
    a: We design templates and graphics and edit short videos. For larger shoots we direct and coordinate photographers and videographers.
  - q: Can social media be combined with ads?
    a: Yes — organic content builds trust, and paid campaigns extend its reach. We plan them together.
cta:
  heading: Let’s give your channels a rhythm.
  text: Tell us which platforms matter to you and what you want them to achieve.
