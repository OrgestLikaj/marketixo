key: content-marketing
lang: it
title: Content marketing
shortTitle: Contenuti
tagline: Testi chiari e utili che si posizionano, convincono e vengono condivisi.
metaTitle: Content marketing e copywriting per siti web | Marketixo
metaDescription: Testi per siti web, articoli SEO, contenuti per campagne e social in inglese, tedesco, italiano e albanese — chiari, utili e basati sulla domanda di ricerca.
hero:
  eyebrow: Servizio 06 — Crescere
  headline: Parole che lavorano.
  lead: Scriviamo testi per siti web, articoli e contenuti per campagne che rispondono a domande reali, generano traffico dai motori di ricerca e spiegano perché scegliere la Sua azienda.
problem:
  heading: I contenuti sono ovunque. Quelli utili sono rari.
  intro: Pubblicare di più non serve, se nessuno legge.
  points:
    - title: Testi sull’azienda, non sul cliente
      text: Le pagine elencano servizi e storia, ma non rispondono mai a ciò che il visitatore è venuto a cercare.
    - title: Blog senza strategia
      text: Articoli scritti per “tenere il sito aggiornato”, che non intercettano alcuna ricerca e non servono alcun obiettivo.
    - title: Tradotti, non localizzati
      text: Pagine tradotte automaticamente che suonano innaturali a un madrelingua e si posizionano male.
solution:
  heading: Prima la strategia, poi le frasi.
  text: Stabiliamo a cosa serve ogni contenuto — posizionarsi, convincere o fidelizzare — analizziamo ciò di cui il Suo pubblico ha bisogno e lo scriviamo con chiarezza, nella lingua di chi legge.
  pillars:
    - title: Basato sulla ricerca
      text: Dati di ricerca, domande dei clienti e lacune dei concorrenti orientano ogni brief.
    - title: Scritto da persone
      text: Testi chiari e accurati, firmati da autori che conoscono l’argomento.
    - title: Madrelingua in quattro lingue
      text: Scritto per ciascun mercato in inglese, tedesco, italiano e albanese.
included:
  heading: Cosa include
  items:
    - title: Strategia dei contenuti
      text: Temi, formati, canali e un calendario legati agli obiettivi di business.
    - title: Testi per il sito web
      text: Home page, pagine dei servizi e landing page scritte per informare e convertire.
    - title: Contenuti SEO
      text: Articoli e guide costruiti sull’intento di ricerca e sui link interni.
    - title: Contenuti per il blog
      text: Articoli regolari e ben documentati che consolidano competenza e fiducia.
    - title: Contenuti social
      text: Didascalie, caroselli e script pensati per ogni piattaforma.
    - title: Contenuti per le campagne
      text: E-mail, annunci e testi per landing page in occasione di lanci e promozioni.
process:
  heading: Come funziona
  steps:
    - title: Ricerca
      text: Domande del pubblico, domanda di ricerca e ciò che sfugge ai concorrenti.
    - title: Pianificazione
      text: Un calendario editoriale con uno scopo chiaro per ogni contenuto.
    - title: Scrittura e revisione
      text: Bozze, il Suo feedback e una revisione finale per chiarezza e accuratezza.
    - title: Pubblicazione e misurazione
      text: Pubblicazione ottimizzata e monitoraggio di traffico e conversioni.
benefits:
  heading: Cosa ottiene
  items:
    - title: Traffico duraturo
      text: Gli articoli evergreen continuano ad attirare visitatori a lungo dopo la pubblicazione.
    - title: Più conversioni
      text: Pagine chiare che rispondono alle obiezioni prima che il visitatore debba sollevarle.
    - title: Una voce coerente
      text: Un unico tono su sito web, social e campagne.
faq:
  - q: Usate l’intelligenza artificiale per scrivere i contenuti?
    a: Possiamo usare strumenti per la ricerca e per le scalette, ma ogni contenuto è scritto, revisionato e verificato da una persona che ne risponde.
  - q: Sapete scrivere con il linguaggio del nostro settore?
    a: Sì. Intervistiamo i Suoi esperti e utilizziamo i Suoi materiali, così i contenuti risultano accurati e specifici, non generici.
  - q: Con quale frequenza dovremmo pubblicare?
    a: La costanza conta più del volume. Per la maggior parte delle aziende, da due a quattro articoli solidi al mese rendono più di riempitivi quotidiani.
  - q: Traducete anche i contenuti esistenti?
    a: Più che tradurre, localizziamo — i contenuti vengono adattati alla terminologia, ai termini di ricerca e alle aspettative di ciascun mercato.
cta:
  heading: Ha qualcosa che merita di essere detto?
  text: La aiutiamo a dirlo con chiarezza — e a farlo arrivare alle persone giuste.
