key: social-media-marketing
lang: it
title: Social media marketing
shortTitle: Social media
tagline: Canali social costanti e coerenti con il brand, che costruiscono un pubblico.
metaTitle: Social media marketing e gestione dei profili | Marketixo
metaDescription: Strategia social, pianificazione dei contenuti, gestione degli account e campagne per Instagram, Facebook e LinkedIn — costanti, coerenti con il brand e misurabili.
hero:
  eyebrow: Servizio 05 — Crescere
  headline: Presenza costante. Voce riconoscibile.
  lead: Pianifichiamo, creiamo e gestiamo contenuti social che mantengono il Suo brand presente e riconoscibile — e trasformano i follower in clienti.
problem:
  heading: Sui social è facile iniziare, difficile continuare.
  intro: Molti account aziendali partono con slancio e si spengono nel giro di qualche settimana.
  points:
    - title: Pubblicare senza un piano
      text: I contenuti nascono all’ultimo minuto, con qualità e messaggi incoerenti.
    - title: Grafiche fuori brand
      text: Ogni post ha un aspetto diverso e il feed non costruisce riconoscibilità.
    - title: Nessun legame con gli obiettivi di business
      text: Si contano i like, ma nessuno sa se i social portano davvero clienti.
solution:
  heading: Un piano, uno stile e un ritmo.
  text: Definiamo a cosa servono i Suoi canali, costruiamo un sistema visivo ed editoriale attorno al brand e seguiamo un calendario di pubblicazione prevedibile, con report legati a obiettivi reali.
  pillars:
    - title: Strategia
      text: Canali, pubblico, pilastri di contenuto e obiettivi concordati in anticipo.
    - title: Produzione
      text: Template, direzione fotografica, brevi video e testi con la voce del Suo brand.
    - title: Community
      text: Risposte, messaggi e interazioni gestiti con tempestività e cortesia.
included:
  heading: Cosa include
  items:
    - title: Strategia social
      text: Scelta dei canali, pilastri di contenuto, tono di voce e obiettivi misurabili.
    - title: Pianificazione dei contenuti
      text: Un calendario editoriale mensile che Lei approva prima di qualsiasi pubblicazione.
    - title: Gestione degli account
      text: Pubblicazione, ottimizzazione dei profili e cura quotidiana degli account.
    - title: Campagne
      text: Lanci, promozioni e campagne stagionali, organiche e a pagamento.
    - title: Crescita della community
      text: Interazione, collaborazioni e tattiche per far crescere il pubblico.
    - title: Produzione creativa
      text: Template per i post, caroselli, storie, reel e semplici animazioni grafiche.
process:
  heading: Come funziona
  steps:
    - title: Audit e strategia
      text: A che punto è oggi, dove si trova il Suo pubblico, che cosa comunicare.
    - title: Brand kit per i social
      text: Template e linee guida che mantengono ogni post coerente con il brand.
    - title: Calendario mensile
      text: Pianificato, prodotto e approvato con un mese di anticipo.
    - title: Report e ottimizzazione
      text: Analisi mensili e aggiustamenti basati su ciò che funziona.
benefits:
  heading: Cosa ottiene
  items:
    - title: Costanza
      text: Una presenza regolare e riconoscibile, senza impegno quotidiano per il Suo team.
    - title: Tempo recuperato
      text: Pianificazione, creazione e pubblicazione gestite al posto Suo.
    - title: Risultati leggibili
      text: Report mensili chiari su copertura, interazioni e richieste.
faq:
  - q: Quali piattaforme gestite?
    a: Principalmente Instagram, Facebook e LinkedIn. Consigliamo di concentrarsi sui due o tre canali in cui il Suo pubblico è davvero presente.
  - q: Approviamo i post prima della pubblicazione?
    a: Sì. Vede e approva il calendario mensile prima che venga pubblicato qualsiasi contenuto.
  - q: Producete anche foto e video?
    a: Progettiamo template e grafiche e montiamo brevi video. Per shooting più impegnativi dirigiamo e coordiniamo fotografi e videomaker.
  - q: I social si possono combinare con la pubblicità?
    a: Sì — i contenuti organici costruiscono fiducia e le campagne a pagamento ne ampliano la portata. Li pianifichiamo insieme.
cta:
  heading: Diamo un ritmo ai Suoi canali.
  text: Ci dica quali piattaforme contano per Lei e quali obiettivi vuole raggiungere.
