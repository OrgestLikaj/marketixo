key: social-media-marketing
lang: de
title: Social-Media-Marketing
shortTitle: Social Media
tagline: Konsistente Social-Media-Kanäle im Markenauftritt, die eine Community aufbauen.
metaTitle: Social-Media-Marketing & -Betreuung | Marketixo
metaDescription: >-
  Social-Media-Strategie, Redaktionsplanung, Kanalbetreuung und Kampagnen für Instagram, Facebook und
  LinkedIn – konsistent, markengerecht und messbar.
hero:
  eyebrow: Leistung 05 – Wachsen
  headline: Regelmäßig präsent. Unverwechselbar Sie.
  lead: >-
    Wir planen, erstellen und betreuen Social-Media-Inhalte, die Ihre Marke sichtbar und wiedererkennbar
    halten – und aus Followern Kunden machen.
problem:
  heading: Social Media ist schnell begonnen und schwer durchgehalten.
  intro: Die meisten Unternehmenskonten starten mit viel Elan und schlafen nach wenigen Wochen ein.
  points:
    - title: Posten ohne Plan
      text: Inhalte entstehen in letzter Minute – entsprechend schwanken Qualität und Botschaft.
    - title: Bilder ohne Markenbezug
      text: Jeder Post sieht anders aus, und der Feed baut keine Wiedererkennung auf.
    - title: Kein Bezug zu Unternehmenszielen
      text: Likes werden gezählt, aber niemand weiß, ob Social Media Kunden bringt.
solution:
  heading: Ein Plan, ein Look und ein Rhythmus.
  text: >-
    Wir legen fest, wofür Ihre Kanäle da sind, entwickeln ein visuelles und redaktionelles System rund um
    Ihre Marke und setzen einen verlässlichen Redaktionsplan um – mit Berichten, die sich an echten Zielen
    orientieren.
  pillars:
    - title: Strategie
      text: Kanäle, Zielgruppen, Themensäulen und Ziele – vorab abgestimmt.
    - title: Produktion
      text: Vorlagen, Bildsprache, kurze Videos und Texte in Ihrer Tonalität.
    - title: Community
      text: Kommentare, Nachrichten und Interaktionen – zeitnah und freundlich beantwortet.
included:
  heading: Leistungsumfang
  items:
    - title: Social-Media-Strategie
      text: Kanalauswahl, Themensäulen, Tonalität und messbare Ziele.
    - title: Redaktionsplanung
      text: Ein monatlicher Redaktionsplan, den Sie freigeben, bevor etwas veröffentlicht wird.
    - title: Kanalbetreuung
      text: Veröffentlichung, Profiloptimierung und laufende Pflege Ihrer Konten.
    - title: Kampagnen
      text: Produktstarts, Aktionen und saisonale Kampagnen – organisch und bezahlt.
    - title: Community-Aufbau
      text: Interaktion, Kooperationen und gezielte Maßnahmen zum Aufbau Ihrer Zielgruppe.
    - title: Kreativproduktion
      text: Post-Vorlagen, Karussells, Stories, Reels und einfache Motion-Grafiken.
process:
  heading: So arbeiten wir
  steps:
    - title: Analyse & Strategie
      text: Wo Sie stehen, wo Ihre Zielgruppe ist und was Sie sagen wollen.
    - title: Brand-Kit für Social Media
      text: Vorlagen und Richtlinien, die jeden Post auf Markenlinie halten.
    - title: Monatlicher Redaktionsplan
      text: Einen Monat im Voraus geplant, produziert und freigegeben.
    - title: Berichten & verfeinern
      text: Monatliche Auswertungen und Anpassungen auf Basis dessen, was funktioniert.
benefits:
  heading: Ihr Nutzen
  items:
    - title: Kontinuität
      text: Eine regelmäßige, wiedererkennbare Präsenz – ohne täglichen Aufwand für Ihr Team.
    - title: Mehr Zeit
      text: Planung, Erstellung und Veröffentlichung übernehmen wir für Sie.
    - title: Klare Erkenntnisse
      text: Verständliche Monatsberichte zu Reichweite, Interaktion und Anfragen.
faq:
  - q: Welche Plattformen betreuen Sie?
    a: >-
      Vor allem Instagram, Facebook und LinkedIn. Wir empfehlen, sich auf die zwei oder drei Kanäle zu
      konzentrieren, auf denen Ihre Zielgruppe tatsächlich unterwegs ist.
  - q: Geben wir die Posts frei, bevor sie online gehen?
    a: Ja. Sie sehen den monatlichen Redaktionsplan und geben ihn frei, bevor etwas veröffentlicht wird.
  - q: Produzieren Sie Fotos und Videos?
    a: >-
      Wir gestalten Vorlagen und Grafiken und schneiden kurze Videos. Bei größeren Shootings übernehmen wir
      Regie und Koordination von Fotografen und Videografen.
  - q: Lässt sich Social Media mit Anzeigen kombinieren?
    a: >-
      Ja – organische Inhalte schaffen Vertrauen, bezahlte Kampagnen erweitern ihre Reichweite. Wir planen
      beides gemeinsam.
cta:
  heading: Bringen wir Rhythmus in Ihre Kanäle.
  text: Sagen Sie uns, welche Plattformen Ihnen wichtig sind und was sie für Sie leisten sollen.
