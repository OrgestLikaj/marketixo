key: branding-logo-design
lang: de
title: Branding & Logodesign
shortTitle: Branding
tagline: Markenauftritte, die etabliert wirken und überall einheitlich bleiben.
metaTitle: Agentur für Branding & Logodesign | Marketixo
metaDescription: >-
  Logodesign, Corporate Design und Markenrichtlinien, mit denen Ihr Unternehmen etabliert wirkt – am
  Bildschirm, in Print und in jeder Kampagne.
hero:
  eyebrow: Leistung 02 – Aufbauen
  headline: Eine Marke, die man erkennt, bevor man den Namen liest.
  lead: >-
    Wir gestalten Logos und komplette Corporate Designs – und machen daraus ein praxistaugliches System,
    mit dem Ihr Team, Ihre Druckerei und Ihre Partner wirklich arbeiten können.
problem:
  heading: Uneinheitlichkeit kostet leise Vertrauen.
  intro: >-
    Kunden beurteilen ein Unternehmen in Sekunden. Eine Marke, die von Kanal zu Kanal anders aussieht,
    wirkt kleiner und weniger verlässlich, als das Unternehmen ist.
  points:
    - title: Ein Logo, das nicht skaliert
      text: Auf dem Firmenschild gut, als Favicon oder Social-Media-Profilbild unleserlich.
    - title: Jeder Kontaktpunkt sieht anders aus
      text: Website, Rechnungen, Social-Media-Posts und Anzeigen nutzen jeweils eigene Farben und Schriften.
    - title: Keine Regeln, an die man sich halten kann
      text: Ohne Richtlinien erfindet jede neue Designerin und jede neue Agentur die Marke neu.
solution:
  heading: Ein System, nicht nur ein Zeichen.
  text: >-
    Wir beginnen mit der Positionierung – wen Sie ansprechen und warum man sich für Sie entscheidet –,
    gestalten dann einen Auftritt, der genau das ausdrückt, und dokumentieren ihn so, dass er auch im
    Alltag Bestand hat.
  pillars:
    - title: Strategie zuerst
      text: Zielgruppe, Wettbewerb und Markenpersönlichkeit sind definiert, bevor der erste Entwurf entsteht.
    - title: Für Bildschirme gemacht
      text: Getestet in Favicon-Größe, auf dunklem und hellem Hintergrund, in Bewegung und im Druck.
    - title: Sofort einsetzbar
      text: Dateien, Vorlagen und Richtlinien in den Formaten, die Ihr Team braucht.
included:
  heading: Leistungsumfang
  items:
    - title: Markenidentität
      text: Positionierung, Persönlichkeit und Tonalität als Leitlinie für jede Entscheidung.
    - title: Logodesign
      text: Hauptlogo, Varianten und ein Bildzeichen, das in jeder Größe funktioniert.
    - title: Corporate Design
      text: Farbpalette, Typografie, Bildsprache, Icons und grafische Elemente.
    - title: Markenrichtlinien
      text: Ein klarer, kompakter Leitfaden mit Dos and Don’ts, den Ihr Team tatsächlich liest.
    - title: Marketingmaterialien
      text: Visitenkarten, Präsentationen, Briefpapier, Beschilderung und Drucksachen.
    - title: Digitales Markensystem
      text: Social-Media-Vorlagen, E-Mail-Signaturen, Anzeigenformate und UI-Tokens für Ihre Website.
process:
  heading: So arbeiten wir
  steps:
    - title: Discovery-Workshop
      text: Ihre Geschichte, Ihre Zielgruppe, Ihr Wettbewerb und Ihre Ziele.
    - title: Konzepte
      text: Zwei bis drei klar unterschiedliche Richtungen, gezeigt in realen Anwendungen.
    - title: Ausarbeitung
      text: Eine Richtung wird mit Ihrem Feedback im Detail ausgearbeitet.
    - title: System & Übergabe
      text: Finale Dateien, Vorlagen und Richtlinien – übergeben mit einer gemeinsamen Durchsicht.
benefits:
  heading: Ihr Nutzen
  items:
    - title: Sofortige Glaubwürdigkeit
      text: Ein professioneller Auftritt, mit dem Sie neben größeren Wettbewerbern bestehen.
    - title: Einheitlichkeit ohne Mehraufwand
      text: Vorlagen und Regeln, die die richtige Wahl zur einfachsten machen.
    - title: Eine Marke, die Ihnen gehört
      text: Alle Rechte an den finalen Entwürfen und Quelldateien.
faq:
  - q: Wie viele Logokonzepte bekommen wir zu sehen?
    a: >-
      In der Regel zwei bis drei klar unterschiedliche Richtungen – jeweils in realen Anwendungen gezeigt,
      etwa im Website-Header, im Social-Media-Profil und auf der Visitenkarte, nicht nur auf weißem
      Hintergrund.
  - q: Können Sie unser bestehendes Logo modernisieren, statt es zu ersetzen?
    a: >-
      Ja. Oft ist eine Weiterentwicklung die beste Lösung: Sie behält den Wiedererkennungswert, den Sie
      aufgebaut haben, und behebt, was nicht funktioniert.
  - q: Welche Dateien erhalten wir?
    a: >-
      Vektor- und Pixelformate (SVG, PDF, PNG), Farbversionen für Bildschirm und Druck, ein Favicon-Set und
      bearbeitbare Vorlagen.
  - q: Gehören uns die Rechte?
    a: Ja. Mit der Schlusszahlung gehen alle Rechte an den finalen Entwürfen auf Sie über.
cta:
  heading: Bereit für einen Auftritt, der zeigt, was in Ihnen steckt?
  text: Erzählen Sie uns von Ihrem Unternehmen und davon, wohin Sie wollen.
