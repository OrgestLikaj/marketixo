key: content-marketing
lang: de
title: Content-Marketing
shortTitle: Content
tagline: Klare, nützliche Texte, die ranken, überzeugen und geteilt werden.
metaTitle: Content-Marketing & Website-Texte | Marketixo
metaDescription: >-
  Website-Texte, SEO-Artikel, Kampagnen- und Social-Media-Inhalte auf Englisch, Deutsch, Italienisch und
  Albanisch – klar, nützlich und an der Suchnachfrage ausgerichtet.
hero:
  eyebrow: Leistung 06 – Wachsen
  headline: Texte, die ihren Job machen.
  lead: >-
    Wir schreiben Website-Texte, Artikel und Kampagneninhalte, die echte Fragen beantworten, Suchtraffic
    gewinnen und überzeugend darlegen, warum man sich für Sie entscheiden sollte.
problem:
  heading: Content gibt es überall. Nützlicher Content ist selten.
  intro: Mehr zu veröffentlichen hilft nicht, wenn es niemand liest.
  points:
    - title: Texte über das Unternehmen statt für den Kunden
      text: Die Seiten zählen Leistungen und Firmengeschichte auf, beantworten aber nie, weswegen der Besucher gekommen ist.
    - title: Blogs ohne Strategie
      text: Artikel, die geschrieben werden, „damit die Website aktuell bleibt“ – ohne Suchbegriff und ohne Ziel.
    - title: Übersetzt statt lokalisiert
      text: Maschinell übersetzte Seiten, die für Muttersprachler falsch klingen und schlecht ranken.
solution:
  heading: Erst die Strategie, dann die Sätze.
  text: >-
    Wir legen fest, wozu jeder Inhalt dient – ranken, überzeugen oder binden –, recherchieren, was Ihre
    Zielgruppe braucht, und schreiben es klar und in ihrer Sprache.
  pillars:
    - title: Recherchebasiert
      text: Suchdaten, Kundenfragen und Lücken bei der Konkurrenz prägen jedes Briefing.
    - title: Von Menschen geschrieben
      text: Klare, präzise Texte von Autorinnen und Autoren, die das Thema verstehen.
    - title: Muttersprachlich in vier Sprachen
      text: Für jeden Markt geschrieben – auf Englisch, Deutsch, Italienisch und Albanisch.
included:
  heading: Leistungsumfang
  items:
    - title: Content-Strategie
      text: Themen, Formate, Kanäle und ein Redaktionskalender, abgestimmt auf Ihre Unternehmensziele.
    - title: Website-Texte
      text: Startseite, Leistungsseiten und Landingpages, die informieren und konvertieren.
    - title: SEO-Content
      text: Artikel und Ratgeber, ausgerichtet auf Suchintention und interne Verlinkung.
    - title: Blogartikel
      text: Regelmäßige, gut recherchierte Beiträge, die Expertise zeigen und Vertrauen schaffen.
    - title: Social-Media-Content
      text: Captions, Karussells und Skripte, passend zur jeweiligen Plattform.
    - title: Kampagnen-Content
      text: E-Mails, Anzeigen und Landingpage-Texte für Produktstarts und Aktionen.
process:
  heading: So arbeiten wir
  steps:
    - title: Recherche
      text: Fragen Ihrer Zielgruppe, Suchnachfrage und was die Konkurrenz übersieht.
    - title: Planung
      text: Ein Redaktionskalender mit einem klaren Zweck für jeden Beitrag.
    - title: Schreiben & redigieren
      text: Entwürfe, Ihr Feedback und ein finales Lektorat auf Klarheit und Richtigkeit.
    - title: Veröffentlichen & messen
      text: Optimierte Veröffentlichung und Auswertung von Traffic und Conversions.
benefits:
  heading: Ihr Nutzen
  items:
    - title: Dauerhafter Traffic
      text: Zeitlose Artikel ziehen noch lange nach der Veröffentlichung Besucher an.
    - title: Mehr Conversions
      text: Klare Seiten, die Einwände beantworten, bevor der Besucher fragen muss.
    - title: Eine einheitliche Stimme
      text: Eine Tonalität auf Website, Social Media und in Kampagnen.
faq:
  - q: Nutzen Sie KI zum Schreiben?
    a: >-
      Für Recherche und Gliederungen setzen wir unter Umständen Tools ein. Jeder Text wird aber von einem
      Menschen geschrieben, redigiert und auf Fakten geprüft, der dafür verantwortlich ist.
  - q: Können Sie in der Fachsprache unserer Branche schreiben?
    a: >-
      Ja. Wir interviewen Ihre Fachleute und arbeiten mit Ihren Unterlagen – so werden die Inhalte präzise
      und konkret statt austauschbar.
  - q: Wie oft sollten wir veröffentlichen?
    a: >-
      Regelmäßigkeit zählt mehr als Menge. Für die meisten Unternehmen bringen zwei bis vier starke Artikel
      pro Monat mehr als täglicher Füllstoff.
  - q: Übersetzen Sie bestehende Inhalte?
    a: >-
      Wir lokalisieren statt zu übersetzen: Die Inhalte werden an Fachbegriffe, Suchbegriffe und
      Erwartungen des jeweiligen Markts angepasst.
cta:
  heading: Sie haben etwas zu sagen?
  text: Wir helfen Ihnen, es klar zu formulieren – und sorgen dafür, dass es die Richtigen lesen.
